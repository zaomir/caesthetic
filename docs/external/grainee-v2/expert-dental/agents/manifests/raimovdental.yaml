agents_satellite_repo: zaomir/raimovdental
agents_satellite_path: /var/www/raimovdental
agents_sync: bash scripts/raimov/sync-agents-bidirectional.sh --apply --commit --push
agents_seed: bash scripts/raimov/sync-agents-bidirectional.sh --apply --commit --push

definition_of_done:
  - Correct RAIMOV authority and namespace used
  - Expert Dental post-audit implementation work reads docs/ssot/EXPERT_DENTAL_PATIENT_CONVERSION_CONTINUITY_IMPLEMENTATION.md for zone ownership, sequencing, adoption and IT architect RACI
  - Personal-brand work reads RAIMOV_WHOLE_PERSON_BRAND.md; Second Opinion remains patient entry, Assessment/Study Club/Intensive remain NOT_LAUNCHED and Academy future/gated
  - Any RAIM SMILE business, product, partnership, content or site task reads docs/ssot/RAIM_SMILE_MARKETING_SEGMENT_STRATEGY.md first as the single master strategy
  - RAIM SMILE keeps Expert Dental as current operator only; portable operator/routing work reads DEC-859 and operator-network SSOT
  - RAIM SMILE partnership work reads the Partnership Network SSOT and Partner Program Matrix, requires measurable recurring distribution and keeps Gulbara non-clinical
  - Baseline partner SmileCare 12 gift inventory is clinic-funded, capped, opt-in and capacity-gated; Premium tier labels and family allocations are not named-partner claims before a signed pilot charter
  - A live partner dashboard is deferred; first pilots use privacy-safe aggregate reporting
  - CAESTHETIC is the separate partner operator/employer; 30% applies only to actual collected partner/VIP SmileCare 12 membership revenue, and CAESTHETIC may also receive a contract-defined percentage of verified collected sales from customers it sourced or documentably reactivated under DEC-866
  - Medical attributed-sales settlement uses the ordinary signed Commercial Schedule and attribution rules without special legal/fiscal/advertising/privacy/fee-splitting activation gates; coordinator and clinician medical-sales percentages stay zero, and the same monetary base is never charged twice
  - Phone is a VIP eligibility key, not password; no first-step OTP; active match reveals only Call/WhatsApp coordinator and runtime remains unimplemented until registry/security/privacy/staffing/release gates pass
  - SmileCare 12 target work reads the product standard and machine-readable contract; G0 is closed and DEC-861 approves only the current-binding public naming cutover
  - RAIM SMILE · Год заботы is the current public name; legacy SKU ids, prices and benefits remain unchanged while expanded v2, trademark, fiscal, capacity, ledger and pilot gates stay fail-closed
  - Essential, Perio and Kids & Teens are assigned only by the licensed operator; Family Account never transfers benefits or exposes clinical tier to a partner
  - Highest commercial bid is applied only after licence, quality, capacity, privacy, disclosure and patient-consent gates
  - Medical data never enters multi-operator bid rounds, partner CRM or attributed-sales ledger
  - BALAM work reads docs/ssot/RAIMOV_BALAM.md first and stays presentation-only until Atabek GO
  - Evidence, medical, legal and media-rights gates preserved
  - RAIMOV.md and project status updated if SSOT or release state drifted
  - "Review Hub: `/feedback/`→stars; 1–3★ recovery only; 4–5★ `/write` then `/maps`; no anonymous map shortcuts"
  - Review Hub compliance gate passes when that runtime is changed
  - RU/EN parity checked on changed routes
  - No patient-identifiable data or secrets committed

owners:
  shared_router: platform
