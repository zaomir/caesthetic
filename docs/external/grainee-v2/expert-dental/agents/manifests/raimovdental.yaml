  sync_from_agents: bash scripts/raimov/sync-agents-bidirectional.sh --apply
  seed_agents: bash scripts/raimov/sync-agents-bidirectional.sh --apply
  sync_bidirectional: bash scripts/raimov/sync-agents-bidirectional.sh --apply --commit --push
  build: node scripts/build-raimovdental.mjs
  deploy: DEPLOY_ASSUME_YES=1 bash scripts/deploy-static-all.sh
  deploy_feedback_hub: bash scripts/raimov/deploy-feedback-hub.sh
  smoke: curl -fsS -o /dev/null -w '%{http_code}' https://raimovdental.com/
  test: node tests/raimovdental/run-all.mjs
  test_feedback_hub: node scripts/raimov/check-feedback-hub.mjs

