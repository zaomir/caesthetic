name: expert-esign

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: expert_esign
      POSTGRES_USER: expert_esign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${DATA_ROOT:-/var/lib/expert-esign}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expert_esign -d expert_esign"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [esign-internal]
    security_opt: ["no-new-privileges:true"]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - ${DATA_ROOT:-/var/lib/expert-esign}/minio:/data
    networks: [esign-internal]
    security_opt: ["no-new-privileges:true"]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-expert-esign-evidence}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 60 ] || { echo 'MinIO did not become ready'; exit 1; }
          sleep 2
        done
        mc mb --ignore-existing --with-lock "local/$${S3_BUCKET}"
        mc version enable "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
    networks: [esign-internal]
    restart: "no"

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest}
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-WEBJS}
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-expert-esign}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD is required}
      WAHA_PRINT_QR: "false"
      WAHA_LOG_LEVEL: info
    volumes:
      - ${DATA_ROOT:-/var/lib/expert-esign}/waha:/app/.sessions
    networks: [esign-internal]
    security_opt: ["no-new-privileges:true"]
    shm_size: 1gb

  api:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: expert-esign:${DEPLOY_SHA:-local}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-/etc/raimov/expert-esign.env}
    environment:
      DATABASE_URL: postgresql://expert_esign:${POSTGRES_PASSWORD}@postgres:5432/expert_esign
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_INTERNAL_FILE_BASE: http://api:8787/internal/waha-file
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/tmp:size=128m,mode=1770,uid=10001,gid=10001
    networks: [esign-internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 30s

networks:
  esign-internal:
    driver: bridge
