spoken_script: |-
  Your Instagram can look busy and successful while generating almost no appointments.
  Watch the journey. A patient opens the profile, chooses among several links, chooses again, reaches pricing, and still cannot complete a booking. Every extra decision adds friction until they leave.
  The problem is not the post. It is what happens after the post.
  Patients may move from social to your website, then cross-check reviews and Maps before contacting you. Instagram starts the journey; the other surfaces either build confidence or break it.
  So those four surfaces must operate as one connected decision system.
  Here, each surface gives a different next step. The patient has to decide which instruction is true, and that uncertainty replaces trust.
  The correction is not more content. It is one clear action everywhere.
  Use the same booking language and destination across every channel. Then every route becomes shorter, easier to understand, and easier to complete.
  The four-four-four-four method aligns the journey, removes unnecessary taps, and turns attention into a clear path to an appointment. Use the final prompt to request your cross-surface check.

