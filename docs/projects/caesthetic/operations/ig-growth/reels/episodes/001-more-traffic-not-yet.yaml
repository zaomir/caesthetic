episode_id: CAE-REEL-001
slug: more-traffic-not-yet
title: "MORE TRAFFIC? NOT YET."
series: NOT YET
track: cold_reach
status: approved

spec_version: "Reel System V3.2"
compiled_against_git_sha: null
question_id: Q05
audience_question: Should I increase ad spend, or fix the website, booking path and follow-up first?
objective: >-
  Help an aesthetic-practice owner recognize that additional traffic should be
  evaluated only after the post-click path is clear enough to find, understand
  and book.
thesis: >-
  More traffic amplifies the experience already present after the click; fix or
  verify the path before deciding whether more traffic deserves budget.
cta:
  action: GET YOUR FREE GROWTH SCORE
  route_label: Link in bio
  experiment_arm: link_in_bio
  single_action: true

format:
  class: Evidence Reel
  canvas: {width: 1080, height: 1920, aspect_ratio: "9:16"}
  duration_target_s: {min: 22.0, max: 30.0}
  language: en

spoken_script: |-
  Before you buy more traffic, check what happens after the click.
  More traffic only amplifies what’s already there. If the next step is unclear, more visitors meet the same friction.
  The problem may be the page, the booking path, or what happens next.
  Can someone find you, understand the offer, and book right now?
  Fix the path first. Then decide whether more traffic deserves your budget.

audio_master:
  synthesis_scope: full_reel_single_master
  provider: ElevenLabs
  voice_id: lxYfHSkYm1EzQzGhdbfc
  canonical_script_source: spoken_script
  no_leading_silence: true
  continuous_voice: true
  starts_at_time_s: 0
  starts_at_frame: 0
  sample_asset_status: required_not_attached
  master_ref: CAESTHETIC/CAESTHETIC MEDIA/Production/reels/CAE-REEL-001/audio/cae-reel-001-elevenlabs-master.wav
  timestamps_ref: CAESTHETIC/CAESTHETIC MEDIA/Production/reels/CAE-REEL-001/audio/cae-reel-001-elevenlabs-master.timestamps.json
  storage: dropbox_only
  per_scene_tts_allowed: false
  segments:
    - {segment_id: AMS01, scene_id: S01, order: 1, timing_source: timestamps_ref, text_anchor: "Before you buy more traffic, check what happens after the click."}
    - {segment_id: AMS02, scene_id: S02, order: 2, timing_source: timestamps_ref, text_anchor: "More traffic only amplifies what’s already there. If the next step is unclear, more visitors meet the same friction."}
    - {segment_id: AMS03, scene_id: S03, order: 3, timing_source: timestamps_ref, text_anchor: "The problem may be the page, the booking path, or what happens next."}
    - {segment_id: AMS04, scene_id: S04, order: 4, timing_source: timestamps_ref, text_anchor: "Can someone find you, understand the offer, and book right now?"}
    - {segment_id: AMS05, scene_id: S05, order: 5, timing_source: timestamps_ref, text_anchor: "Fix the path first. Then decide whether more traffic deserves your budget."}

references:
  method:
    - ref: docs/ssot/CAESTHETIC_DAILY_GROWTH_NOTE_VIDEO_PIPELINE.md
      sections: ["2. Evidence first", "3. Format classes and scene contract", "4. Closing Card V1", "9. CTA and response operations"]
      use: structure, evidence boundaries, CTA and closing-card contract
    - ref: docs/ssot/CAESTHETIC_DAILY_GROWTH_NOTE_OPENER_CANON.md
      use: opener composition and typography authority
    - ref: docs/ssot/CAESTHETIC_HEYGEN_PRODUCTION_SYSTEM.md
      use: Valerie speaking-plate production contract
    - ref: docs/ssot/CAESTHETIC_VALERIE_AVATAR_LIBRARY.md
      use: approved Valerie source identity and plate lineage
    - ref: docs/ssot/CAESTHETIC_OWNER_MARKETING_QUESTIONS.md
      sections: ["Q05"]
      use: canonical audience question
    - ref: docs/ssot/EVIDENCE_AND_IMPACT_STANDARD.md
      use: claim classification and evidence labeling
  evidence: []
  claim_contract:
    epistemic_class: Illustrative
    evidence_required_before_production: false
    allowed_scope: general sequencing and self-diagnosis; no clinic-specific result
    forbidden:
      - fabricated traffic, conversion, revenue or booking metrics
      - claim that a named clinic is losing patients
      - guaranteed outcome from fixing the path

scenes:
  - scene_id: S01
    role: motion_editorial_hook_and_framing
    scene_type: opening_master_clip
    duration_target_s: {min: 6.0, max: 8.0}
    spoken_text: Before you buy more traffic, check what happens after the click.
    audio_segment_ref: AMS01
    delivery_mode: on_camera
    spoken_timing:
      starts_at_frame: 0
      leading_silence_s: 0
      continuous_through_1a_1b: true
    on_screen_text:
      headline_lines: ["MORE TRAFFIC?", "NOT YET."]
      emphasis_line: "NOT YET."
      placement: fixed_lower_third_within_left_editorial_zone
      behavior: fully_visible_at_frame_0_then_disappears_during_continuous_speech
    visual_direction: >-
      One continuous Valerie master clip from frame 0: Valerie is already
      animated and speaking while the complete headline is visible. Keep the
      headline in the fixed lower-third area inside the left editorial zone and
      Valerie in the right half. The headline disappears at the 1A→1B visual
      boundary while Valerie continues the same line without a pause or cut.
    presenter_mode: valerie_continuous_master
    source_plate:
      preferred: docs/projects/caesthetic/operations/ig-growth/footage/valerie-clean-plates/vcp-009-clinic-blazer-smile.png
      selection_status: preferred_not_locked
      geometry_contract: >-
        If geometry conflicts, first use deterministic reposition/reframe. If
        that is insufficient, Kling may move Valerie to the right half while
        preserving identity, outfit and environment and leaving negative space
        on the left. The template never chases Valerie.
    kling_instructions:
      applies_to: opening-master visual motion only
      prompt: >-
        Animate subtle natural breathing, a small head turn and eye contact.
        Preserve Valerie's identity, blazer, clinic environment and lighting.
        Keep Valerie in the right half and leave clean negative space on the
        left. No generated text or logo, no camera jump and no scene change.
      renderer_owns: [headline, headline_exit, final_composite]
    lip_sync:
      lip_sync_provider: capability_gated
      capability_status: unverified
      audio_segment_ref: AMS01
      requirement: use prepared ElevenLabs segment; never synthesize voice
    transition: visual_only_headline_exit_during_continuous_speech_no_cut
    asset_outputs:
      speaking_plate: null
      audio_master_no_leading_silence: audio_master.master_ref
      master_clip: null

  - scene_id: S02
    role: explanation
    scene_type: editorial_text_card
    duration_target_s: {min: 3.0, max: 4.0}
    spoken_text: More traffic only amplifies what’s already there. If the next step is unclear, more visitors meet the same friction.
    audio_segment_ref: AMS02
    delivery_mode: voice_over
    on_screen_text:
      headline: MORE TRAFFIC AMPLIFIES WHAT'S ALREADY THERE.
      support: If the next step is unclear, more visitors meet the same friction.
    visual_direction: >-
      Cream editorial information surface, one takeaway, no Valerie, no fake UI
      and no decorative evidence artifact.
    presenter_mode: voice_over
    source_plate: null
    kling_instructions: null
    heygen_instructions: null
    transition: restrained_editorial_cut
    asset_outputs: {card: null}

  - scene_id: S03
    role: explanation
    scene_type: valerie_speaking
    duration_target_s: {min: 4.0, max: 5.5}
    spoken_text: The problem may be the page, the booking path, or what happens next.
    audio_segment_ref: AMS03
    delivery_mode: on_camera
    on_screen_text:
      sequential_emphasis: [PAGE, BOOKING, FOLLOW-UP]
    visual_direction: >-
      Valerie in a related angle with restrained sequential emphasis; the words
      clarify the spoken categories and do not masquerade as evidence.
    presenter_mode: valerie_speaking_plate
    source_plate:
      selection: from approved Valerie avatar/source namespace
      status: pending_production_selection
    kling_instructions: null
    lip_sync:
      lip_sync_provider: capability_gated
      capability_status: unverified
      audio_segment_ref: AMS03
      requirement: use prepared ElevenLabs segment; never synthesize voice
    transition: clean_cut
    asset_outputs: {speaking_plate: null, composited_scene: null}

  - scene_id: S04
    role: pause_trigger
    scene_type: valerie_self_check_overlay
    duration_target_s: {min: 4.0, max: 5.5}
    spoken_text: Can someone find you, understand the offer, and book right now?
    audio_segment_ref: AMS04
    delivery_mode: on_camera
    on_screen_text:
      question_lines: ["CAN SOMEONE", "BOOK WITH YOU", "RIGHT NOW?"]
      scale: large
    visual_direction: >-
      Continue moving Valerie/evidence-compatible motion while the large
      self-check overlay appears; do not turn the pause trigger into a separate
      static evidence card.
    presenter_mode: valerie_speaking_plate
    source_plate:
      selection: continuity with S03
      status: pending_production_selection
    kling_instructions: null
    lip_sync:
      lip_sync_provider: capability_gated
      capability_status: unverified
      audio_segment_ref: AMS04
      requirement: use prepared ElevenLabs segment; never synthesize voice
    transition: continuous_motion_overlay
    asset_outputs: {speaking_plate: null, composited_scene: null}

  - scene_id: S05
    role: decision_implication
    scene_type: conclusion
    duration_target_s: {min: 3.0, max: 4.0}
    spoken_text: Fix the path first. Then decide whether more traffic deserves your budget.
    audio_segment_ref: AMS05
    delivery_mode: on_camera_or_voice_over
    on_screen_text:
      emphasis: FIX THE PATH FIRST.
    visual_direction: >-
      One decision implication only; no new evidence and no second CTA.
    presenter_mode: voice_or_valerie_continuity
    source_plate:
      selection: production choice consistent with the batch's Valerie arm
      status: pending_production_selection
    kling_instructions: null
    lip_sync:
      lip_sync_provider: capability_gated
      capability_status: unverified
      audio_segment_ref: AMS05
      applies_if: Valerie arm is selected
      requirement: use prepared ElevenLabs segment; never synthesize voice
    transition: visual_rhyme_into_close
    asset_outputs: {plate: null, composited_scene: null}

  - scene_id: S06
    role: closing_card
    scene_type: closing_card_v1
    duration_target_s: {min: 1.5, max: 2.0}
    spoken_text: null
    on_screen_text:
      logo: "[REAL LOGO]"
      headline: FIX THE PATH BEFORE YOU FUND THE TRAFFIC.
      cta: GET YOUR FREE GROWTH SCORE
      route_label: Link in bio
    visual_direction: >-
      Canonical real logo, one conclusion and one CTA on the cream/navy/burgundy
      system. The route label supports the single CTA experiment arm. Visually
      rhyme with the opener; no Valerie, new evidence, fake UI or second CTA.
    presenter_mode: none
    source_plate:
      logo: site-caesthetic/assets/brand/logo-long.png
      logo_policy: use byte-for-byte; never redraw, generate, crop or distort
    kling_instructions: null
    heygen_instructions: null
    transition: replay_rhyme
    asset_outputs: {closing_card: null}

