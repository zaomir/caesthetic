spoken_script: |-
  A practice can make two hundred thousand dollars a month — and still quietly lose patients every day.
  Because patients don't judge your practice in one place. They cross-check.
  They find you on Google. They open your website. They look at your social. Then they check your reputation.
  And if those four surfaces tell four slightly different stories, trust starts leaking before anyone books.
  That's why the first problem isn't always traffic.
  More ads can simply send more people into the same leak.
  First, find where trust breaks. Then fix the highest-impact surface. Then decide what deserves more budget.
  That's what a CAESTHETIC Growth Score is designed to reveal.
  Before you spend more on growth — find what's already holding it back.
