  - id: CAE-TR-2026-08-17
    publish_date: 2026-08-17
    question_id: L5
    objective: Maps rating is one signal, not a demand system.
    hook_text: A 4.9 can still hide a demand leak.
    lines:
      - { t: "0.0-3.5", text: "A 4.9 can still hide a demand leak." }
      - { t: "3.5-10.0", text: "Rating is not demand." }
      - { t: "10.0-18.0", text: "Check velocity. Check replies." }
      - { t: "18.0-24.0", text: "We score the card. Not the star." }
      - { t: "24.0-30.0", text: "Free Growth Score" }
    vo_script: |
      A 4.9 rating can still hide a demand leak.
      Maps does not rank you on the star alone. It reads the rest of the card.
      Look at review velocity. Look at whether the practice answers. Those are observable. The star is not.
      We score the card — categories, proof, response — before anyone buys more traffic.
      Free Growth Score. Link in bio.
    bg_prompt: |
      Vertical 9:16, 8 seconds, slow push-in. Cream editorial office desk,
      printed papers and a closed laptop, soft daylight, no faces, no logos,
      no readable UI or brand names. Clinical journal mood, not spa, not gold,
      not neon. Shallow depth of field.
    caption: |
      A 4.9 on Maps is one signal. It is not a demand system.

      Before you buy more traffic, look at the rest of the card: categories, services, how recently reviews arrive, and whether the practice replies.

      We score the public card first. Then we say what to fix — and what not to fund yet.

      Want the free Growth Score for your practice? Link in bio.
    hashtags: [medspa, googlebusinessprofile, aestheticclinic, practicegrowth]
    do_not_say:
      - This clinic is losing patients.
      - Invented review counts, ranks, or revenue.
      - We'll get you to 5.0.
    status: draft

  - id: CAE-TR-2026-08-18
    publish_date: 2026-08-18
    question_id: L7
    objective: Booking path is part of marketing; ads cannot fix a broken path.
    hook_text: Ads can’t fix a broken book path.
    lines:
      - { t: "0.0-3.5", text: "Ads can’t fix a broken book path." }
      - { t: "3.5-11.0", text: "How many taps to a real next step?" }
      - { t: "11.0-18.0", text: "Traffic is not a booking." }
      - { t: "18.0-24.0", text: "Fix the path. Then buy traffic." }
      - { t: "24.0-30.0", text: "Free Growth Score" }
    vo_script: |
      If the site can’t book on mobile, ads only buy frustration.
      Open your site on a phone. How many taps to a real next step — a time, a form that submits, or a call?
      A pretty page with no action is not marketing. It is a brochure that you are paying to distribute.
      Fix the path first. Then decide whether the practice needs more traffic.
      We score booking friction in the free Growth Score. Link in bio.
    bg_prompt: |
      Vertical 9:16, 8 seconds, slow lateral move. Empty clinic corridor or
      reception threshold, parchment and charcoal palette, no people, no
      treatment rooms, no pink marble, no gold fixtures, no readable signage.
    caption: |
      If a new patient cannot book on a phone, paid traffic buys frustration.

      Before the next ad dollar: open the site on mobile. Count the taps. Find the dead ends. See whether Book, Call, or the form actually completes.

      Booking flow is part of marketing. We score it before we pitch a Sprint.

      Free Growth Score — link in bio.
    hashtags: [medspa, booking, aestheticclinic, websitecx]
    do_not_say:
      - Your conversion rate is X%.
      - Invented form-abandon or call volume.
      - Medical advice or treatment pitches.
    status: draft

  - id: CAE-TR-2026-08-19
    publish_date: 2026-08-19
    question_id: Q11
    objective: Enquiry response speed is an observable operations leak.
    hook_text: The lead arrived. Who answered?
    lines:
      - { t: "0.0-3.5", text: "The lead arrived. Who answered?" }
      - { t: "3.5-11.0", text: "Speed is a system. Not a mood." }
      - { t: "11.0-18.0", text: "After hours still counts." }
      - { t: "18.0-24.0", text: "Measure the gap. Then staff it." }
      - { t: "24.0-30.0", text: "Free Growth Score" }
    vo_script: |
      A new enquiry is not a patient yet. It is a clock that has started.
      Response speed is a system: who owns the inbox, what the first reply is, and how long the gap is.
      Evenings and weekends still count. An unanswered message is an observable leak.
      We do not invent your minutes. We tell you to measure the gap — then decide what to staff.
      Free Growth Score. Link in bio.
    bg_prompt: |
      Vertical 9:16, 8 seconds. Phone face-down on a cream desk, soft amber
      notification glow, no readable lock-screen text, no hands, no faces.
      Quiet operations mood. No fake CRM dashboard.
    caption: |
      A new enquiry starts a clock. Who owns it — and how long is the gap?

      We do not invent your response time. We ask you to measure it: first reply, after-hours coverage, and whether the thread reaches a real next step.

      That is operations. It is also marketing.

      Free Growth Score — link in bio.
    hashtags: [medspa, frontdesk, practiceoperations, aestheticclinic]
    do_not_say:
      - You lose X patients after 5 minutes.
      - Guaranteed booking lift from faster replies.
    status: draft

