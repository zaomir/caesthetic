name: Durable agent execution
on:
  push:
    paths: ['.agent-execution/**', 'AGENTS.md', 'CODEX.md', '.github/workflows/durable-agent-execution.yml']
  pull_request:
    paths: ['.agent-execution/**', 'AGENTS.md', 'CODEX.md', '.github/workflows/durable-agent-execution.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 .agent-execution/check.py
