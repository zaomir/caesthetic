  <rect x="92" y="690" width="1416" height="112" rx="22" fill="#f4e7eb"/>
  <circle cx="142" cy="746" r="26" fill="#8f2442"/>
  <text x="142" y="755" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">?</text>
  <text x="190" y="731" fill="#102847" font-family="Arial, sans-serif" font-size="24" font-weight="700">Authorized internal data is required to find the actual point of loss.</text>
  <text x="190" y="772" fill="#4f5968" font-family="Arial, sans-serif" font-size="21">Without it, we cannot conclude how the team, booking, attendance, or payment performs.</text>
</svg>

