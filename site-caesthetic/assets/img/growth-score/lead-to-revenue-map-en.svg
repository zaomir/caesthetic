<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Lead-to-Revenue Path</title>
  <desc id="description">Eight internal practice stages. Every stage is marked not assessed because authorized access to internal data is required.</desc>
  <rect width="1600" height="900" fill="#f5f1ea"/>
  <rect x="44" y="44" width="1512" height="812" rx="28" fill="#fffdf9" stroke="#d5cdc2" stroke-width="2"/>

  <text x="92" y="120" fill="#102847" font-family="Georgia, serif" font-size="54" font-weight="700">Lead-to-Revenue Path</text>
  <text x="92" y="170" fill="#4f5968" font-family="Arial, sans-serif" font-size="25">Public evidence does not show what happens inside the practice after an enquiry.</text>
  <rect x="1232" y="86" width="250" height="54" rx="27" fill="#f4e7eb"/>
  <text x="1357" y="121" text-anchor="middle" fill="#8f2442" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">ACCESS REQUIRED</text>

  <g font-family="Arial, sans-serif">
