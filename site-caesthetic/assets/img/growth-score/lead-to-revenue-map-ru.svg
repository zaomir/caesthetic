<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Путь от обращения до оплаты</title>
  <desc id="description">Восемь внутренних этапов клиники. Все этапы отмечены как непроверенные, потому что для них нужен разрешённый доступ к внутренним данным.</desc>
  <rect width="1600" height="900" fill="#f5f1ea"/>
  <rect x="44" y="44" width="1512" height="812" rx="28" fill="#fffdf9" stroke="#d5cdc2" stroke-width="2"/>

  <text x="92" y="120" fill="#102847" font-family="Georgia, serif" font-size="54" font-weight="700">Путь от обращения до оплаты</text>
  <text x="92" y="170" fill="#4f5968" font-family="Arial, sans-serif" font-size="25">Открытые данные не показывают, что происходит внутри клиники после обращения.</text>
  <rect x="1232" y="86" width="250" height="54" rx="27" fill="#f4e7eb"/>
  <text x="1357" y="121" text-anchor="middle" fill="#8f2442" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">НУЖЕН ДОСТУП</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(92 224)">
      <rect width="330" height="190" rx="22" fill="#f8f6f1" stroke="#c8c1b8" stroke-width="2"/>
      <circle cx="42" cy="42" r="24" fill="#e6e2dc"/>
      <text x="42" y="50" text-anchor="middle" fill="#102847" font-size="22" font-weight="700">1</text>
      <text x="28" y="100" fill="#102847" font-size="27" font-weight="700">Обращение</text>
      <text x="28" y="134" fill="#102847" font-size="27" font-weight="700">получено</text>
      <text x="28" y="170" fill="#68717e" font-size="17" font-weight="700" letter-spacing="1">НЕ ПРОВЕРЕНО</text>
    </g>
    <g transform="translate(454 224)">
      <rect width="330" height="190" rx="22" fill="#f8f6f1" stroke="#c8c1b8" stroke-width="2"/>
      <circle cx="42" cy="42" r="24" fill="#e6e2dc"/>
      <text x="42" y="50" text-anchor="middle" fill="#102847" font-size="22" font-weight="700">2</text>
      <text x="28" y="117" fill="#102847" font-size="27" font-weight="700">Первый ответ</text>
      <text x="28" y="170" fill="#68717e" font-size="17" font-weight="700" letter-spacing="1">НЕ ПРОВЕРЕНО</text>
    </g>
    <g transform="translate(816 224)">
      <rect width="330" height="190" rx="22" fill="#f8f6f1" stroke="#c8c1b8" stroke-width="2"/>
      <circle cx="42" cy="42" r="24" fill="#e6e2dc"/>
      <text x="42" y="50" text-anchor="middle" fill="#102847" font-size="22" font-weight="700">3</text>
      <text x="28" y="100" fill="#102847" font-size="27" font-weight="700">Уточнение</text>
      <text x="28" y="134" fill="#102847" font-size="27" font-weight="700">запроса</text>
      <text x="28" y="170" fill="#68717e" font-size="17" font-weight="700" letter-spacing="1">НЕ ПРОВЕРЕНО</text>
    </g>
    <g transform="translate(1178 224)">
      <rect width="330" height="190" rx="22" fill="#f8f6f1" stroke="#c8c1b8" stroke-width="2"/>
      <circle cx="42" cy="42" r="24" fill="#e6e2dc"/>
      <text x="42" y="50" text-anchor="middle" fill="#102847" font-size="22" font-weight="700">4</text>
      <text x="28" y="117" fill="#102847" font-size="27" font-weight="700">Запись</text>
      <text x="28" y="170" fill="#68717e" font-size="17" font-weight="700" letter-spacing="1">НЕ ПРОВЕРЕНО</text>
    </g>

    <g transform="translate(92 446)">
      <rect width="330" height="190" rx="22" fill="#f8f6f1" stroke="#c8c1b8" stroke-width="2"/>
      <circle cx="42" cy="42" r="24" fill="#e6e2dc"/>
      <text x="42" y="50" text-anchor="middle" fill="#102847" font-size="22" font-weight="700">5</text>
      <text x="28" y="117" fill="#102847" font-size="27" font-weight="700">Подтверждение</text>
      <text x="28" y="170" fill="#68717e" font-size="17" font-weight="700" letter-spacing="1">НЕ ПРОВЕРЕНО</text>
    </g>
    <g transform="translate(454 446)">
      <rect width="330" height="190" rx="22" fill="#f8f6f1" stroke="#c8c1b8" stroke-width="2"/>
      <circle cx="42" cy="42" r="24" fill="#e6e2dc"/>
      <text x="42" y="50" text-anchor="middle" fill="#102847" font-size="22" font-weight="700">6</text>
      <text x="28" y="117" fill="#102847" font-size="27" font-weight="700">Визит</text>
      <text x="28" y="170" fill="#68717e" font-size="17" font-weight="700" letter-spacing="1">НЕ ПРОВЕРЕНО</text>
    </g>
    <g transform="translate(816 446)">
      <rect width="330" height="190" rx="22" fill="#f8f6f1" stroke="#c8c1b8" stroke-width="2"/>
      <circle cx="42" cy="42" r="24" fill="#e6e2dc"/>
      <text x="42" y="50" text-anchor="middle" fill="#102847" font-size="22" font-weight="700">7</text>
      <text x="28" y="117" fill="#102847" font-size="27" font-weight="700">Консультация</text>
      <text x="28" y="170" fill="#68717e" font-size="17" font-weight="700" letter-spacing="1">НЕ ПРОВЕРЕНО</text>
    </g>
    <g transform="translate(1178 446)">
      <rect width="330" height="190" rx="22" fill="#f8f6f1" stroke="#c8c1b8" stroke-width="2"/>
      <circle cx="42" cy="42" r="24" fill="#e6e2dc"/>
      <text x="42" y="50" text-anchor="middle" fill="#102847" font-size="22" font-weight="700">8</text>
      <text x="28" y="117" fill="#102847" font-size="27" font-weight="700">Оплата</text>
      <text x="28" y="170" fill="#68717e" font-size="17" font-weight="700" letter-spacing="1">НЕ ПРОВЕРЕНО</text>
    </g>
  </g>

  <rect x="92" y="690" width="1416" height="112" rx="22" fill="#f4e7eb"/>
  <circle cx="142" cy="746" r="26" fill="#8f2442"/>
  <text x="142" y="755" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">?</text>
  <text x="190" y="731" fill="#102847" font-family="Arial, sans-serif" font-size="24" font-weight="700">Чтобы найти реальное место потери, нужны разрешённые внутренние данные.</text>
  <text x="190" y="772" fill="#4f5968" font-family="Arial, sans-serif" font-size="21">Без них нельзя делать выводы о работе команды, записи, визитах или оплате.</text>
</svg>
