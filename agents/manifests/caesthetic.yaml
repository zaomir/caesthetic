id: caesthetic
name: CAESTHETIC
status: active
phase: 1

read_first:
  - docs/projects/caesthetic/AGENTS.md
  - docs/ssot/CAESTHETIC.md
  - docs/projects/caesthetic/PROJECT_STATUS.md

allowed_paths:
  - site-caesthetic/**
  - docs/projects/caesthetic/**
  - docs/caesthetic/**
  - docs/ssot/CAESTHETIC*.md
  - docs/research/caesthetic/**
  - docs/audits/caesthetic/**
  - scripts/caesthetic/**
  - tests/caesthetic/**

forbidden_paths:
  - site-raimovdental/**
  - site-toxifillers/**

protected_paths: []

topics:
  strategy: docs/ssot/CAESTHETIC.md
  growth_score:
    ssot: docs/ssot/CAESTHETIC.md
    spec: docs/caesthetic/growth_score_spec.md
    code:
      - scripts/caesthetic/growth-score-engine.mjs
      - scripts/caesthetic/render-growth-score.mjs
    roots:
      - site-caesthetic/score/
  growth_economics: docs/ssot/CAESTHETIC_GROWTH_ECONOMICS_ENGINE.md
  growth_system_operating_model: docs/ssot/CAESTHETIC_GROWTH_SYSTEM_OPERATING_MODEL.md
  owner_marketing_questions: docs/ssot/CAESTHETIC_OWNER_MARKETING_QUESTIONS.md
  project_status: docs/projects/caesthetic/PROJECT_STATUS.md
  routing: docs/projects/caesthetic/ROUTER.md

commands:
  sync: cd /var/www/grainee-v2 && git pull --ff-only origin main
  sync_bidirectional: bash scripts/caesthetic/sync-agents-bidirectional.sh --apply --commit --push
  smoke: curl -fsS -o /dev/null -w '%{http_code}' https://caesthetic.com/
  test: node --test tests/caesthetic/growth-score-*.test.mjs
  render_check: node scripts/caesthetic/render-growth-score.mjs --check

deploy_target: caesthetic
agents_satellite_repo: zaomir/caesthetic
agents_satellite_path: /var/www/caesthetic
agents_sync: bash scripts/caesthetic/sync-agents-bidirectional.sh --apply --commit --push
agents_seed: bash scripts/caesthetic/sync-agents-bidirectional.sh --apply --commit --push

definition_of_done:
  - CAESTHETIC master SSOT remains authoritative
  - Four-surface model preserved across Growth Score, Sprint and Growth System
  - No fabricated proof or outcome guarantees
  - No prohibited review gating
  - Runtime changes shipped through caesthetic deploy target and production smoke

owners:
  shared_router: platform
